<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circuit Bloom · 반응형 확인</title>
    <style>
      body{margin:0;padding:20px;background:#091e20;color:#d7edb1;font:14px sans-serif;display:grid;justify-items:center;gap:15px}
      nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{padding:8px 12px;cursor:pointer}iframe{border:1px solid #59725a;border-radius:12px;max-width:100%}
    </style>
  </head>
  <body>
    <nav aria-label="반응형 검증 크기"><span>게임 화면 너비</span><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="760">760px</button></nav>
    <iframe id="game-frame" title="반응형 Circuit Bloom 게임" src="../" width="390" height="844"></iframe>
    <script>
      document.querySelectorAll('button[data-width]').forEach(button => button.addEventListener('click', () => { document.querySelector('iframe').width = button.dataset.width; }));
    </script>
  </body>
</html>
