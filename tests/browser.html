<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circuit Bloom · 브라우저 회귀 확인</title>
    <style>
      #test-controls{position:relative;z-index:10;padding:14px;background:#fff;color:#111;font:14px sans-serif;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
      #test-controls button{padding:8px;color:#111}
    </style>
  </head>
  <body>
    <nav id="test-controls" aria-label="회귀 확인 도구">
      <strong>테스트 전용 시계 · <output id="test-date"></output></strong>
      <button id="next-day">한국 날짜 하루 넘기기</button>
      <button id="timer-midnight">타이머로 자정 넘기기</button>
      <button id="tile-midnight">타일 포커스에서 날짜 넘기기</button>
      <button id="help-midnight">도움말 중 날짜 넘기기</button>
      <button id="restart">테스트 진도 초기화</button>
      <button id="level-999">999단계로 테스트</button>
    </nav>
    <div id="app"></div>
    <script type="module">
      import { millisecondsUntilNextKstDay } from '/src/daily.js';
      // Only this development fixture overrides time. Production imports index.html.
      const RealDate = window.Date;
      let now = RealDate.parse('2026-11-03T14:59:59Z');
      window.Date = class extends RealDate {
        constructor(...args) { super(...(args.length ? args : [now])); }
        static now() { return now; }
      };
      const nativeStorage = window.localStorage;
      const key = 'circuit-bloom.browser-test';
      // Seed after navigation, so the departing game's autosave cannot overwrite it.
      const requestedLevel = new URLSearchParams(location.search).get('level');
      if (requestedLevel === '1' || requestedLevel === '999') {
        nativeStorage.setItem(key + ':circuit-bloom.v1', JSON.stringify({ level: Number(requestedLevel), records: {}, sound: false }));
        nativeStorage.removeItem(key + ':circuit-bloom.sessions.v1');
        history.replaceState(null, '', location.pathname);
      }
      Object.defineProperty(window, 'localStorage', { value: {
        getItem(storageKey) { return nativeStorage.getItem(key + ':' + storageKey); },
        setItem(storageKey, value) { nativeStorage.setItem(key + ':' + storageKey, value); },
      } });
      const updateDate = () => {
        document.querySelector('#test-date').textContent = new RealDate(now + 9 * 3600000).toISOString().replace('Z', ' KST');
      };
      const advanceDay = () => {
        now += millisecondsUntilNextKstDay(new RealDate(now));
        updateDate();
      };
      const nextDay = () => {
        advanceDay();
        window.dispatchEvent(new Event('focus'));
      };
      updateDate();
      await import('/src/main.js');
      const practiceClock = document.createElement('button');
      practiceClock.id = 'practice-next-day';
      practiceClock.textContent = '테스트: 연습 중 날짜 넘기기';
      practiceClock.style.cssText = 'margin-top:18px;padding:8px';
      practiceClock.addEventListener('click', nextDay);
      document.querySelector('#practice-dialog').append(practiceClock);
      document.querySelector('#next-day').addEventListener('click', nextDay);
      document.querySelector('#timer-midnight').addEventListener('click', advanceDay);
      document.querySelector('#tile-midnight').addEventListener('click', () => {
        document.querySelector('.tile').focus();
        nextDay();
      });
      document.querySelector('#help-midnight').addEventListener('click', () => {
        document.querySelector('#help').click();
        nextDay();
      });
      document.querySelector('#restart').addEventListener('click', () => {
        location.href = location.pathname + '?level=1';
      });
      document.querySelector('#level-999').addEventListener('click', () => {
        location.href = location.pathname + '?level=999';
      });
    </script>
  </body>
</html>
